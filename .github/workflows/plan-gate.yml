name: Plan Gate

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  check-plan-and-evidence:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Plan and Evidence sections
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.pull_request.body || '';

            const placeholderPatterns = [
              /^tbd$/i,
              /^n\/?a$/i,
              /^todo$/i,
              /^tba$/i,
              /^none$/i,
              /^pending$/i,
              /^-+$/,
            ];

            function extractSection(text, name) {
              const regex = new RegExp(
                `##\\s*${name}\\s*\\r?\\n([\\s\\S]*?)(?=\\r?\\n##\\s|$)`,
                'i'
              );
              const match = text.match(regex);
              return match ? match[1] : null;
            }

            function meaningfulLines(text) {
              if (!text) return [];
              // Strip HTML comments (e.g. template instructions).
              const cleaned = text.replace(/<!--[\s\S]*?-->/g, '');
              const lines = cleaned
                .split('\n')
                .map((l) => l.trim())
                .filter((l) => l.length > 0);

              return lines.filter((line) => {
                let stripped = line.replace(/^[-*]\s*/, '');
                stripped = stripped.replace(/^\*\*[^*]+\*\*:?\s*/, '');
                stripped = stripped.replace(/^[A-Za-z /]+:\s*/, '');
                stripped = stripped.trim();

                if (stripped.length < 3) return false;
                if (placeholderPatterns.some((p) => p.test(stripped))) return false;

                return true;
              });
            }

            function checkSection(name) {
              const raw = extractSection(body, name);
              if (raw === null) {
                return `Missing "## ${name}" section.`;
              }
              const lines = meaningfulLines(raw);
              if (lines.length === 0) {
                return `"## ${name}" section is empty or only contains placeholder text.`;
              }
              return null;
            }

            const errors = [checkSection('Plan'), checkSection('Evidence')].filter(Boolean);

            if (errors.length > 0) {
              core.setFailed(
                'Plan Gate failed:\n- ' +
                  errors.join('\n- ') +
                  '\n\nPlease fill in the Plan and Evidence sections of the PR description with meaningful content.'
              );
            } else {
              core.info('Plan Gate passed: Plan and Evidence sections both contain meaningful content.');
            }
